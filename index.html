<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <!--
      El ícono es la bandera a cuadros del logo, redibujada en geometría limpia
      y en negro sobre ámbar: el logo entero a 32 px es una mancha. El .ico es
      para los navegadores que no leen SVG; el apple-touch-icon y el manifest,
      para cuando se guarda el sitio en la pantalla de inicio del celular.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Automotores AutoShop Jujuy — 0km y usados en San Salvador de Jujuy. Tomamos tu usado como parte de pago."
    />

    <!--
      El dominio del sitio va escrito acá y en `src/data/sitio.ts` (SITIO_URL).
      Acá no hay otra forma: los que leen estas etiquetas —la vista previa de
      WhatsApp, Facebook, los buscadores— no ejecutan JS, así que la URL
      tiene que venir escrita en el HTML. Las rutas internas corrigen el
      canonical al navegar (ver `lib/titulo.ts`).
    -->
    <link rel="canonical" href="https://autoshopjujuy.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Automotores AutoShop Jujuy" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://autoshopjujuy.com/" />
    <meta property="og:title" content="Automotores AutoShop Jujuy — 0km y usados" />
    <meta
      property="og:description"
      content="0km y usados en San Salvador de Jujuy. Tomamos tu usado como parte de pago."
    />
    <meta property="og:image" content="https://autoshopjujuy.com/img/hero-poster.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Fuentes autoalojadas. Antes esto era un <link> a fonts.googleapis.com con
      su preconnect; se sacó porque si Google no responde el sitio se dibuja en
      Arial y la identidad tipográfica desaparece. Ahora salen de public/fonts/
      y el sitio funciona sin red.

      Las dos van precargadas porque las dos se usan arriba del pliegue:
      Archivo en el titular del hero y Martian Mono en el ticker.
      `crossorigin` es obligatorio aun siendo del mismo origen — las fuentes se
      piden en modo CORS, y sin el atributo el navegador descarga el archivo
      dos veces en vez de reusar el precargado.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/archivo-latin-wdth.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/martian-mono-latin-wght.woff2"
      crossorigin
    />

    <title>Automotores AutoShop Jujuy — 0km y usados</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
